name: Prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore locked dependencies
        shell: pwsh
        run: |
          python -m pip install uv==0.10.12
          uv sync --locked
          dotnet restore Jarvis.slnx --configfile NuGet.Config --locked-mode
      - name: Build and unit tests
        shell: pwsh
        run: |
          dotnet build Jarvis.slnx --no-restore -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test Jarvis.slnx --no-build -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked ruff check speech scripts tests/python
      # Real-model speech and microphone checks are local; no audio is uploaded to CI.
