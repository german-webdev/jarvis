[project]
name = "jarvis-speech"
version = "0.1.0"
description = "Local speech worker for the JARVIS Windows prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faster-whisper>=1.1,<2",
  "piper-tts>=1.3,<2",
  "vosk==0.3.45",
  "onnxruntime>=1.20,<2",
  "numpy>=2,<3",
  "huggingface-hub>=0.30,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["speech"]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
